<script>
document.addEventListener('DOMContentLoaded', function () {
    const options = document.querySelectorAll('.food-option');
    const inputField = document.getElementById('selected_food');

    options.forEach(option => {
        option.addEventListener('click', function () {
            // Remove selection class style from all options
            options.forEach(o => o.classList.remove('selected'));
            // Add style class to currently selected option
            this.classList.add('selected');
            // Write choice text value string inside our secret hidden input
            inputField.value = this.getAttribute('data-value');
        });
    });

    // Form confirmation guard check
    document.getElementById('foodForm').addEventListener('submit', function (e) {
        if (!inputField.value) {
            e.preventDefault();
            alert('Please select a delicious one option first! 🥰');
        }
    });
});
</script>
