}

    <body>
        <header>

        </header>
        <main>

     <div class="container d-flex justify-content-center align-items-center min-vh-100">

    <div class="container-fluid mt-5"
         style="
            width:520px;
            height:300px;
            background-color:#ffffffd1;
            color:#ff95a7;
            border-radius:10px;
            box-shadow:0 0 10px pink;
         ">

        <div style="
            text-align:center;
            width:100%;
            height:100%;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
        ">

            <!-- Header -->
            <h1 class="font-black-ops mb-2"
                style="
                    font-size:42px;
                    line-height:1.2;
                    color:#ff8fa3;
                ">
                Hey Annia ☺️
            </h1>

            <div class="font-black-ops mb-4"
                 style="
                    font-size:25px;
                    color:#ff8fa3;
                ">
                I have a little question for you...
            </div>


            <!-- Question -->
            <h2 class="font-black-ops mb-4"
                style="
                    font-size:32px;
                    line-height:1.25;
                ">
                🌸 Will you go out with me? 🌸
            </h2>


            <!-- Buttons -->
            <div class="position-relative d-flex gap-3 justify-content-center align-items-center"
                 style="
                    width:100%;
                    min-height:50px;
                 ">

                <a
                    href="sayyes.html"
                    class="btn btn-outline-danger say_yes"
                    style="
                        width:100px;
                        z-index:10;
                    ">
                    Yes
                </a>

                <button
                    type="button"
                    id="runaway-no"
                    class="btn btn-outline-danger"
                    style="
                        width:200px;
                        transition:all 0.1s ease;
                        z-index:10;
                    ">
                    No (Are you sure?)
                </button>

            </div>

        </div>
    </div>

</div>













   

<script>
    const noButton = document.getElementById('runaway-no');

    function runaway() {
        // Get random coordinates based on the browser window size
        const x = Math.random() * (window.innerWidth - noButton.offsetWidth - 20);
        const y = Math.random() * (window.innerHeight - noButton.offsetHeight - 20);
        
        // Switch position to fixed/absolute so it can break free and jump anywhere
        noButton.style.position = 'fixed';
        noButton.style.left = `${x}px`;
        noButton.style.top = `${y}px`;
    }

    // Trigger on click as requested
    noButton.addEventListener('click', runaway);

    // OPTIONAL: Trigger on mouse hover too so they can't even touch it!
    noButton.addEventListener('mouseover', runaway);
</script>
