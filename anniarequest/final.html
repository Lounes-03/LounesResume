<script>
    // ----------------------------------------------------
    // ១. ប្រព័ន្ធបង្កើតព្រិលធ្លាក់ (Romantic Snow Effect)
    // ----------------------------------------------------
    const canvas = document.getElementById('snow-canvas');
    const ctx = canvas.getContext('2d');

    let screenWidth = window.innerWidth;
    let screenHeight = window.innerHeight;
    canvas.width = screenWidth;
    canvas.height = screenHeight;

    window.addEventListener('resize', () => {
        screenWidth = window.innerWidth;
        screenHeight = window.innerHeight;
        canvas.width = screenWidth;
        canvas.height = screenHeight;
    });

    const maxFlakes = 50;
    const flakes = [];

    for (let i = 0; i < maxFlakes; i++) {
        flakes.push({
            x: Math.random() * screenWidth,
            y: Math.random() * screenHeight,
            r: Math.random() * 3 + 1,
            d: Math.random() * maxFlakes
        });
    }

    function drawSnow() {
        ctx.clearRect(0, 0, screenWidth, screenHeight);
        ctx.fillStyle = 'rgba(255, 140, 150, 0.5)'; // គ្រាប់ព្រិលពណ៌ផ្កាឈូកស្រាល
        ctx.beginPath();
        for (let i = 0; i < maxFlakes; i++) {
            const f = flakes[i];
            ctx.moveTo(f.x, f.y);
            ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2, true);
        }
        ctx.fill();
        moveSnow();
    }

    function moveSnow() {
        for (let i = 0; i < maxFlakes; i++) {
            const f = flakes[i];
            f.y += Math.cos(f.d) + 1 + f.r / 2;
            f.x += Math.sin(0.1) * 0.5;

            if (f.y > screenHeight) {
                flakes[i] = { x: Math.random() * screenWidth, y: 0, r: f.r, d: f.d };
            }
        }
    }
    setInterval(drawSnow, 25);

    // ----------------------------------------------------
    // ២. ប្រព័ន្ធបាញ់បេះដូងភ្ញាក់ផ្អើល (Pure JS Surprise Floating Hearts)
    // ----------------------------------------------------
    function createHeartSurprise() {
        // បាញ់បេះដូងចំនួន 35 គ្រាប់រាយប៉ាយគ្នា
        for (let i = 0; i < 35; i++) {
            setTimeout(() => {
                const heart = document.createElement('div');
                // ផ្លាស់ប្តូរពណ៌បេះដូងឱ្យមានភាពរស់រវើក (❤️ ឬ 💖)
                heart.innerHTML = Math.random() > 0.5 ? '❤️' : '💖';
                heart.style.position = 'fixed';
                heart.style.bottom = '-20px';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.fontSize = Math.random() * 20 + 20 + 'px'; // ទំហំចន្លោះពី 20px ទៅ 40px
                heart.style.userSelect = 'none';
                heart.style.opacity = '1';
                heart.style.transition = 'all 3.5s ease-out';
                heart.style.zIndex = '9999';
                heart.style.pointerEvents = 'none';
                
                document.body.appendChild(heart);

                // បង្ហោះបេះដូងឡើងលើទៅលើមេឃ និងរេទៅឆ្វេងស្តាំតិចៗ
                setTimeout(() => {
                    const sideMovement = Math.random() * 300 - 150; // រេឆ្វេងស្តាំ
                    heart.style.transform = `translate(${sideMovement}px, -120vh) scale(${Math.random() * 0.5 + 1})`;
                    heart.style.opacity = '0';
                }, 50);

                // លុបចោលវិញក្រោយពេលហោះផុតអេក្រង់
                setTimeout(() => {
                    heart.remove();
                }, 3500);
            }, i * 120); // ឱ្យវាចេញមកម្តងមួយៗដេញគ្នា
        }
    }

    // រត់មុខងារបាញ់បេះដូងភ្លាមៗនៅពេលដែល Page ដើរជោគជ័យ
    window.addEventListener('DOMContentLoaded', createHeartSurprise);
</script>
